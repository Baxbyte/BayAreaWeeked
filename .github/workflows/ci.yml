name: CI
on:
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fast image-safety engine
        run: npm i --no-save @tensorflow/tfjs-node@4.22.0 || true
      - run: npm test
      - name: Family-friendly image check
        run: npm run safety
      - run: npm run build
      - name: Browser check of the built site (filters, map, search, forms, SEO files)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/test/smoke-browser.mjs
