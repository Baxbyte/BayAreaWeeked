name: Daily scrape, build & deploy

on:
  schedule:
    - cron: '17 12 * * *'   # ~5am Pacific: morning refresh
    - cron: '47 0 * * *'    # ~5pm Pacific: evening refresh (new "tonight" + weekend listings)
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the failure limit (circuit breaker) for this run'
        type: boolean
        default: false
      skip_scrape:
        description: 'Rebuild from committed data without scraping'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['data/events.json', 'data/scrape-report.json', 'data/geocache.json', 'data/indexnow-state.json', 'data/images.json', '**.md']

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-site
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      paused: ${{ steps.breaker.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: breaker
        name: Circuit breaker (max 3 failures per 24h, then pause 24h)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: daily.yml
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: node .github/scripts/circuit-breaker.mjs

  build:
    needs: guard
    if: needs.guard.outputs.paused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      site_url: ${{ steps.url.outputs.site_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fast image-safety engine
        run: npm i --no-save @tensorflow/tfjs-node@4.22.0 || true
      - run: npm test

      - name: Scrape event sources
        if: ${{ !inputs.skip_scrape }}
        timeout-minutes: 20
        continue-on-error: true
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GEOCODE: '1'
          GEOCODE_MAX: '120'
        run: npm run scrape

      - name: Family-friendly image check (blocks deploy on any problem)
        run: npm run safety

      - name: Save fresh data to the repo
        if: ${{ !inputs.skip_scrape }}
        run: |
          git config user.name "bayarea-weekend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json data/scrape-report.json data/geocache.json data/image-safety.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: daily event refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin main && git push origin HEAD:main
          fi

      - name: Pick the public site URL
        id: url
        run: |
          URL="${{ vars.SITE_URL }}"
          if [ -z "$URL" ]; then URL="https://bayareaweeked.vercel.app"; fi
          echo "site_url=${URL%/}" >> "$GITHUB_OUTPUT"
          echo "Building for ${URL%/}"

      - name: Build site
        env:
          SITE_URL: ${{ steps.url.outputs.site_url }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          PUBLIC_SIGNUP_ENDPOINT: ${{ vars.PUBLIC_SIGNUP_ENDPOINT }}
          PUBLIC_SPONSOR_ENDPOINT: ${{ vars.PUBLIC_SPONSOR_ENDPOINT }}
          PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          PUBLIC_ANALYTICS_SNIPPET_URL: ${{ vars.PUBLIC_ANALYTICS_SNIPPET_URL }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: sitemaps
          path: dist/sitemap*.xml
          retention-days: 3

  ping-search-engines:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: sitemaps
          path: dist
      - name: Wait for Vercel to publish the fresh data (it deploys every push to main)
        env:
          SITE_URL: ${{ needs.build.outputs.site_url }}
        run: |
          want=$(node -p "require('./data/events.json').generatedAt")
          for i in $(seq 1 40); do
            code=$(curl -s -o live.json -w '%{http_code}' "$SITE_URL/data/events.json?cb=$i" || true)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then echo "::error::$SITE_URL is password-protected ($code) — turn off Vercel Deployment Protection for production so people and Google can see it"; exit 1; fi
            got=$(node -p "try{require('./live.json').generatedAt}catch{''}" 2>/dev/null)
            if [ "$code" = "200" ] && [ "$got" = "$want" ]; then echo "Live site has data from $want"; exit 0; fi
            echo "waiting ($i): HTTP $code, live=$got want=$want"; sleep 15
          done
          echo "::warning::Live site did not show the new data within 10 minutes; pinging anyway"
      - name: IndexNow + WebSub (+ optional Google Indexing API)
        env:
          SITE_URL: ${{ needs.build.outputs.site_url }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          GOOGLE_INDEXING_SA_JSON: ${{ secrets.GOOGLE_INDEXING_SA_JSON }}
        run: node scripts/indexnow.mjs
      - name: Remember what was submitted
        run: |
          git config user.name "bayarea-weekend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/indexnow-state.json
          if ! git diff --cached --quiet; then
            git commit -m "data: indexnow state"
            git pull --rebase -X theirs origin main && git push origin HEAD:main
          fi
