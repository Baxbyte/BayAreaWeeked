name: Refresh Bay Area photos

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the failure limit (circuit breaker) for this run'
        type: boolean
        default: false
      refresh:
        description: 'Re-pick every photo (otherwise only fills in missing ones)'
        type: boolean
        default: false
  schedule:
    - cron: '23 13 * * 1'   # weekly, Monday morning Pacific
  push:
    branches: [main]
    paths: ['data/photo-picks.json', 'scripts/images/build-images.mjs']

permissions:
  contents: write
  actions: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      paused: ${{ steps.breaker.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: breaker
        name: Circuit breaker (max 3 failures per 24h, then pause 24h)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: images.yml
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: node .github/scripts/circuit-breaker.mjs

  photos:
    needs: guard
    if: needs.guard.outputs.paused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fast image-safety engine
        run: npm i --no-save @tensorflow/tfjs-node@4.22.0 || true
      - name: Find photos (Wikimedia Commons + Pexels)
        timeout-minutes: 45
        continue-on-error: true
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/images/build-images.mjs ${{ inputs.refresh && '--refresh' || '' }}
      - name: Family-friendly image check (nothing is saved unless every photo passes)
        run: npm run safety
      - name: Save photo list
        run: |
          git config user.name "bayarea-weekend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/images.json public/photos
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Bay Area photos"
            git pull --rebase -X theirs origin main && git push origin HEAD:main
          fi
      - name: Rebuild the site with the new photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --ref main -f skip_scrape=true || true
      - name: Render contact sheets for review
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/images/contact-sheet.mjs review
      - name: Publish contact sheets to the image-review branch
        run: |
          cd review
          git init -q -b image-review
          git config user.name "bayarea-weekend-bot"
          git config user.email "bot@users.noreply.github.com"
          git add . && git commit -qm "Photo review sheets"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" image-review
