name: Live site check

# After each push to main: waits until Vercel serves that commit, then runs the browser test suite on the live site.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: 'Site to test'
        default: 'https://bayareaweeked.vercel.app'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Wait for Vercel to serve this commit
        if: ${{ github.event_name == 'push' }}
        env:
          LIVE_URL: ${{ vars.SITE_URL || 'https://bayareaweeked.vercel.app' }}
        run: |
          for i in $(seq 1 40); do
            live=$(curl -s "$LIVE_URL/version.txt?cb=$i" | tr -d '[:space:]')
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Live site is on $GITHUB_SHA"; exit 0; fi
            echo "waiting ($i): live=$live"; sleep 15
          done
          echo "::error::Vercel did not publish $GITHUB_SHA within 10 minutes"; exit 1
      - name: Public access (not behind a Vercel login)
        env:
          LIVE_URL: ${{ inputs.url || vars.SITE_URL || 'https://bayareaweeked.vercel.app' }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$LIVE_URL/")
          echo "Home page: HTTP $code"
          if [ "$code" != "200" ]; then echo "::error::$LIVE_URL returned $code — if 401, turn off Vercel Deployment Protection for production"; exit 1; fi
          for p in /explore/ /this-weekend/ /sitemap.xml /robots.txt /rss.xml /data/search.json; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$LIVE_URL$p"); echo "$p → $c"; [ "$c" = "200" ] || exit 1
          done
          curl -s "$LIVE_URL/robots.txt" | grep -i sitemap
          curl -s "$LIVE_URL/" | grep -o '<link rel="canonical" href="[^"]*"'
      - name: Browser test suite on the live site
        env:
          LIVE_URL: ${{ inputs.url || vars.SITE_URL || 'https://bayareaweeked.vercel.app' }}
        run: node scripts/test/smoke-browser.mjs
