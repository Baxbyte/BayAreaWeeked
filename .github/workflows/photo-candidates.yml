name: Photo candidates for hand-picking
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the failure limit (circuit breaker) for this run'
        type: boolean
        default: false
      only:
        description: 'Regex of targets to gather (e.g. ^genre:). Empty = all'
        required: false
  push:
    branches: [main]
    paths: ['scripts/images/candidates.mjs', 'scripts/images/commons.mjs', 'scripts/images/plans.mjs']
permissions:
  actions: read
  contents: write
concurrency:
  group: photo-candidates
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      paused: ${{ steps.breaker.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - id: breaker
        name: Circuit breaker (max 3 failures per 24h, then pause 24h)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: photo-candidates.yml
          # Manual override: tick "force" when running by hand, or put [force-run] in a pushed commit message.
          FORCE: ${{ (inputs.force || contains(github.event.head_commit.message, '[force-run]')) && 'true' || 'false' }}
        run: node .github/scripts/circuit-breaker.mjs

  candidates:
    needs: guard
    if: needs.guard.outputs.paused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fast image-safety engine
        run: npm i --no-save @tensorflow/tfjs-node@4.22.0 || true
      - run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Gather candidates and render sheets
        env:
          ONLY: ${{ inputs.only }}
        run: node scripts/images/candidates.mjs candidates
      - name: Publish to the photo-candidates branch
        run: |
          cd candidates
          git init -q -b photo-candidates
          git config user.name "bayarea-weekend-bot"
          git config user.email "bot@users.noreply.github.com"
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json  # images only: no Vercel preview build
          git add . && git commit -qm "Photo candidates"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" photo-candidates
