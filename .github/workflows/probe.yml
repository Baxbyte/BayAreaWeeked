name: Probe event sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/scrape/probe.mjs']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/scrape/probe.mjs
